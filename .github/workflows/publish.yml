name: Publish Quarto website

on:
  workflow_dispatch:
  push:
    branches: main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Install TinyTeX
        run: quarto install TinyTex

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter numpy matplotlib scipy PyLTSpice

      - name: Test SVG conversion
        run: |
          for f in \
            designflow/designflow1/circuit1.svg \
            designflow/designflow1/circuit2.svg \
            designflow/designflow1/plot1.svg
          do
            echo "Testing $f"
            timeout 30s rsvg-convert \
              --format=pdf "$f" \
              > /tmp/"$(basename "${f%.svg}").pdf"
            echo "Exit code: $?"
          done
          
      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
