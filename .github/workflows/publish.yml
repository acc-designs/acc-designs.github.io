
name: Publish Quarto website

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install TinyTeX
        run: quarto install tinytex
        
      - name: Install Chrome Headless Shell
        run: quarto install chrome-headless-shell --no-prompt
        
      - name: Install SVG converter
        run: sudo apt-get install --yes --no-install-recommends librsvg2-bin

      - name: Install Python packages
        run: |
          python -m pip install \
            jupyter \
            numpy \
            matplotlib \
            scipy \
            PyLTSpice

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
