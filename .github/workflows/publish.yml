
name: Publish Quarto website

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install TinyTeX
        run: quarto install tinytex

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin

      - name: Install Chrome Headless Shell
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable

          SHELL_BIN="$(find "$HOME/.cache/puppeteer" \
            -type f -name chrome-headless-shell -perm -111 | head -n 1)"

          test -n "$SHELL_BIN"
          echo "CHROME_HEADLESS_SHELL=$SHELL_BIN" >> "$GITHUB_ENV"

          "$SHELL_BIN" --version
          "$SHELL_BIN" --no-sandbox --disable-gpu \
            --dump-dom https://example.com

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            jupyter \
            numpy \
            matplotlib \
            scipy \
            PyLTSpice

      - name: Check installed versions
        run: |
          quarto --version
          python --version
          python -m pip --version
          rsvg-convert --version
          python -m pip show jupyter numpy matplotlib scipy PyLTSpice
          quarto list tools
          
      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
